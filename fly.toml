# Fly.io config for the single-host deploy (backend serves the API + frontend).
# The app name must be globally unique → becomes https://<app>.fly.dev.
# Rename below if "dpeppsmove" is taken, then update PUBLIC_ORIGIN to match.
app = "dpeppsmove"
primary_region = "dfw"   # Dallas — close to the move

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/move.db"
  PUBLIC_ORIGIN = "https://dpeppsmove.fly.dev"

# Persistent disk so the SQLite database survives restarts/deploys.
[[mounts]]
  source = "move_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
